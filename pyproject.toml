[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvconfig"
version = "1.0.0"
description = "Typed reader and writer for LabVIEW configuration files, with LabVIEW-correct escaping, path and boolean rules"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["labview", "ini", "config", "configuration", "configuration-file", "openg", "ni"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
lvconfig = "lvconfig._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/lvconfig"
Issues = "https://github.com/JaviLianes8/lvconfig/issues"
Changelog = "https://github.com/JaviLianes8/lvconfig/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/lvconfig"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/lvconfig",
    "tests",
    "scripts/capture_ni.py",
    "scripts/check.ps1",
    "requirements-dev.txt",
    "README.md",
    "GUIDE.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]
# NI's configuration file excerpts are local test references only; only their manifest ships.
exclude = ["**/__pycache__", "**/*.pyc", "tests/fixtures/ni/*.ini"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
